<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Fajr Gym</title>
  <link rel="stylesheet" href="./style.css?v=10">
</head>
<body>
<main>
<header><b>FAJR GYM ✦</b><h1>نادي فجر</h1></header>

<section id="home" class="page on">
  <div class="hero">
    <img src="fajr-main.png">
    <div><span>👑 أهلاً يا معضّلة</span><h2>وش بنعذّب اليوم؟</h2><p>الدلع مسموح، الهروب لا.</p></div>
  </div>

  <h3>أيام التمرين</h3>

  <button class="day" onclick="chooseDay('legs')">
    <strong>🦵 يوم الأرجل</strong>
    <small>5 مراحل • المتاح الآن</small>
  </button>

  <button class="day" style="margin-top:10px" onclick="chooseDay('chest')">
    <strong>💪 صدر + تراي</strong>
    <small>6 تمارين • المتاح الآن</small>
  </button>

  <p class="locked">🔒 باقي الأيام بنضيفها يوم بيوم</p>
</section>

<section id="outfit" class="page">
  <button class="back" onclick="show('home')">→ رجوع</button>
  <h2 id="outfitTitle">اختاري الأوتفيت 🎀</h2>
  <p>سوتيانا رياضية + ليغينز. لأن اللون طبعًا قرار مصيري.</p>
  <img class="preview" src="fajr-pose.png">
  <div class="colors">
    <button onclick="pick('وردي','🩷')">🩷 وردي</button>
    <button onclick="pick('أسود','🖤')">🖤 أسود</button>
    <button onclick="pick('أبيض','🤍')">🤍 أبيض</button>
  </div>
  <div id="outfitMsg" class="msg">🩷 الوردي؟ جاية تتمرنين وتسوين مشاكل بنفس الوقت.</div>
  <button class="primary" onclick="start()">اعتمدي الأوتفيت وابدئي ✨</button>
</section>

<section id="workout" class="page">
  <div class="row"><button class="back" onclick="show('home')">→ خروج</button><b id="count"></b></div>
  <div class="bar"><i id="bar"></i></div>
  <article>
    <img id="pic">
    <div class="pad">
      <span id="tag"></span>
      <h2 id="title"></h2>
      <p id="copy"></p>
      <div class="inputs"><input placeholder="الوزن"><input placeholder="العدات"></div>
      <button class="primary" onclick="done()">✅ خلصت</button>
      <div class="two"><button onclick="mirror()">🪞 بشوف النتيجة</button><button onclick="lazy()">😭 مالي خلق</button></div>
      <div id="msg" class="msg hide"></div>
    </div>
  </article>
</section>

<section id="finish" class="page">
  <img class="preview" src="fajr-main.png">
  <div class="finish" id="finishText"></div>
  <button class="primary" onclick="show('home')">الرئيسية</button>
</section>

</main>
<script src="./script.js?v=10"></script>
</body>
</html>
